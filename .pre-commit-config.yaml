default_language_version:
  python: python3.11

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/kynan/nbstripout
    rev: 0.8.1
    hooks:
      - id: nbstripout
        exclude: ^notebooks/00_walkthrough\.ipynb$

  - repo: local
    hooks:
      - id: pytest-quick
        name: pytest-quick (offline subset)
        entry: .venv/Scripts/python.exe -m pytest tests/test_smoke.py tests/data tests/features tests/eval -q --no-cov
        language: system
        pass_filenames: false
        stages: [manual]
