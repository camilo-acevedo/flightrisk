name: risk_lgbm_sweep
estimator: lightgbm
direction: maximize
metric: auc
n_trials: 50
timeout_seconds: 900

search_space:
  learning_rate:
    type: float
    low: 0.01
    high: 0.2
    log: true
  num_leaves:
    type: int
    low: 15
    high: 255
  min_data_in_leaf:
    type: int
    low: 50
    high: 500
  feature_fraction:
    type: float
    low: 0.5
    high: 1.0
  bagging_fraction:
    type: float
    low: 0.5
    high: 1.0
  lambda_l2:
    type: float
    low: 0.0
    high: 5.0
  n_estimators:
    type: int
    low: 200
    high: 1500
