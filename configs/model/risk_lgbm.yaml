name: risk_lgbm
track: risk
estimator: lightgbm
calibration: isotonic
params:
  objective: binary
  learning_rate: 0.05
  num_leaves: 63
  max_depth: -1
  min_data_in_leaf: 200
  feature_fraction: 0.85
  bagging_fraction: 0.85
  bagging_freq: 5
  lambda_l2: 1.0
  n_estimators: 800
  early_stopping_rounds: 50
focal_loss:
  enabled: false
  gamma: 2.0
  alpha: 0.25
