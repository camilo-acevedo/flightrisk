[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flightrisk"
version = "0.1.0"
description = "Honest churn modeling: risk, survival, and uplift on real public data, scored in dollars."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "camilo-acevedo" }]
keywords = ["churn", "survival", "uplift", "causal-inference", "mlflow"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.26,<2.2",
    "pandas>=2.1,<2.3",
    "pyarrow>=15.0",
    "scipy>=1.11",
    "scikit-learn>=1.6,<1.7",
    "lightgbm>=4.3",
    "xgboost>=2.0",
    "lifelines>=0.28",
    "scikit-survival>=0.25,<0.26",
    "econml>=0.16,<0.17",
    "shap>=0.44",
    "matplotlib>=3.8",
    "mlflow>=2.12",
    "optuna>=3.6",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pandera>=0.18",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "streamlit>=1.33",
    "joblib>=1.3",
    "tqdm>=4.66",
    "click>=8.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1",
    "pytest-cov>=5.0",
    "hypothesis>=6.99",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
    "pandas-stubs>=2.1",
    "types-PyYAML>=6.0",
    "pre-commit>=3.7",
    "nbstripout>=0.7",
    "ipykernel>=6.29",
]
deeplearning = [
    "torch>=2.2",
    "pycox>=0.2.3",
]
data = [
    "dvc[s3]>=3.50",
    "kaggle>=1.6",
]
docs = [
    "sphinx>=8.0",
    "furo>=2024.5.6",
    "myst-parser>=3.0",
]

[project.scripts]
flightrisk = "flightrisk.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["flightrisk*"]
exclude = ["tests*", "notebooks*", "reports*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks", "data", "reports", "mlruns"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = []
"scripts/*" = []
"flightrisk/cli.py" = []

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = false
warn_return_any = false
ignore_missing_imports = true
disable_error_code = ["no-any-return", "operator", "arg-type"]
exclude = [
    "tests/",
    "notebooks/",
    "build/",
    "dist/",
    "scripts/",
    "docs/",
    "flightrisk/cli.py",
    "flightrisk/eval/plots.py",
    "flightrisk/serving/streamlit_app.py",
]

[[tool.mypy.overrides]]
module = ["flightrisk.serving.api"]
disable_error_code = ["attr-defined"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = ["-ra", "--strict-markers", "--cov=flightrisk", "--cov-report=term-missing"]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
branch = true
source = ["flightrisk"]
omit = ["flightrisk/serving/streamlit_app.py", "flightrisk/cli.py"]
